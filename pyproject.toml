[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rivals"
version = "0.1.0"
description = "Simulation and strategy engine for 21 Rivals (head-to-head, shared-shoe blackjack)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["rivals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
